name: Linters

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8.16']

    steps:
      - uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up PDM
        run: pip install pdm==2.20.1

      - name: Install dependencies
        run: |
          pdm sync

      - name: Run black
        run: pdm run black . --check

      - name: Run flake
        run: pdm run flake8

      - name: Run mypy
        run: pdm run mypy .

      - name: Run isort
        run: pdm run isort . --check